[project]
name = "kills-at-minute"
requires-python = "~=3.11.0"
version = "0.0.1"
description = "Kill probability calculator for League of Legends match intervals"
dependencies = [
    "streamlit[snowflake]"
]

[tool.uv]
constraint-dependencies = ["numba>=0.56.0"]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
streamlit = false
